name: Publish to Maven Central

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build and Publish to Staging Directory
        run: ./gradlew :core:publishAllPublicationsToStagingRepository --no-daemon
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create Deployment Bundle
        run: |
          cd core/build/staging-repository
          zip -r ../../../bundle.zip .
          cd ../../../

      - name: Upload Bundle to Sonatype Central Portal
        run: |
          curl --request POST \
            --url 'https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC' \
            --user '${{ secrets.SONATYPE_USERNAME }}:${{ secrets.SONATYPE_PASSWORD }}' \
            --header 'Content-Type: multipart/form-data' \
            --form 'bundle=@bundle.zip'